log_level = "INFO"

[registration]
registration_form_channel_name = "registration-form"
registration_help_channel_name = "registration-help"
registration_log_channel_name = "registration-log"

pretix_base_url = "https://pretix.eu/api/v1/organizers/pyladiescon/events/2025"

registered_cache_file = "/tmp/registered_log.txt"
pretix_cache_file = "/tmp/pretix_cache.json"

[registration.item_to_roles]
"Sponsors Ticket" = ["Participant", "Sponsor"]
"Speaker Ticket" = ["Participant", "Speaker"]
"General Admission Ticket" = ["Participant"]

[registration.variation_to_roles]
"Volunteer" = ["Organizer", "Volunteer"]

[program_notifications]
# the conference slug comes from the PORTAL_CONFERENCE environment variable
api_base_url = "https://portal.pyladies.com/api/v1"
schedule_cache_file = "/tmp/schedule_cache.json"
livestream_url_file = "livestreams.toml"
main_notification_channel_name = "session-notifications"
# placeholder until the conference site has session pages
session_url = "https://conference.pyladies.com/schedule/#{slug}"

# optional simulated start time for testing program notifications
# simulated_start_time = "2024-07-10T07:30:00+02:00"

# optional fast mode for faster testing of program notifications
# will only take effect if simulated_start_time is set
# fast_mode = true

[guild_statistics]
required_role = "Organizer"
